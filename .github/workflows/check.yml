name: check
on:
  push:
    branches: ['**']   # метки версий (v*) не запускают проверку повторно
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff==0.17.3   # версия закреплена: новые правила не ломают сборку внезапно
      - run: sh tools/check.sh   # только синтетические данные; реальные дела в CI не передаются
