name: check
on:
  push:
    branches: [main]   # ветки проверяются через PR (без двойного запуска); метки версий не запускают проверку
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff==0.17.3   # версия закреплена: новые правила не ломают сборку внезапно
      - run: sh tools/check.sh   # только синтетические данные; реальные дела в CI не передаются
      - run: pip install -e . && kin schema persons >/dev/null   # pyproject.toml: команда kin ставится и работает
  windows:
    # пока для диагностики: показывает, что ломается в Windows, но не блокирует слияние
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: python -m unittest discover -s tests 2>&1 | tee unittest.log; exit ${PIPESTATUS[0]}
      - if: failure()
        shell: bash
        run: python tools/ci_annotate.py unittest.log   # упавшие тесты — аннотациями (видны без входа на GitHub)
