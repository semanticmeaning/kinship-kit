<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Древо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&display=swap">
<style>
/* Раскладка: полноэкранное полотно-древо (колена — горизонтальные полосы), слева шкала колен, справа панель поиска/профиля, внизу легенда. */
:root {
  --bg: #eceff2; --band: #e3e7ec; --surface: #ffffff; --ink: #1d2733; --muted: #8b95a1; --soft: #5d6875;
  --rule: #cfd6de; --edge: #3b4654; --edge-fam: #8e99a6; --hyp: #b4236e; --hyp-bg: #fbeef5; --rej: #b9c0c8;
  --ok: #1f7a4d; --male: #6f95d8; --female: #d98aa6; --sexu: #a9b2bc; --shadow: 0 1px 2px rgb(20 30 45 / .10), 0 2px 8px rgb(20 30 45 / .06);
  --serif: "PT Serif", Georgia, "Times New Roman", serif; --sans: "PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --band: #161c23; --surface: #1d252e; --ink: #e5e9ee; --muted: #7f8a97; --soft: #a7b0bb;
  --rule: #2e3843; --edge: #c3cbd4; --edge-fam: #6f7b88; --hyp: #f06aa9; --hyp-bg: #33202b; --rej: #4a535d;
  --ok: #4cc78a; --male: #5e86c9; --female: #c77593; --sexu: #5d6773; --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161c; --band: #161c23; --surface: #1d252e; --ink: #e5e9ee; --muted: #7f8a97; --soft: #a7b0bb;
  --rule: #2e3843; --edge: #c3cbd4; --edge-fam: #6f7b88; --hyp: #f06aa9; --hyp-bg: #33202b; --rej: #4a535d;
  --ok: #4cc78a; --male: #5e86c9; --female: #c77593; --sexu: #5d6773; --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.35 var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hyp); outline-offset: 2px; }

#vp { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#vp.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges, #edges-top { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges path, #edges line, #edges-top path { fill: none; }
#edges, #edges-top, .ring { transition: opacity .15s; }
.ring { fill: var(--surface); stroke: var(--edge-fam); stroke-width: 1.6; }
.ring.doc { stroke: var(--edge); }
.xmark { stroke: var(--soft); stroke-width: 2.4; stroke-linecap: round; }
.ended { display: block; font-size: 12.5px; color: var(--soft); margin-top: 3px; }
.arrow { fill: var(--edge-fam); }
#world.hl #edges > :not(.band), #world.hl #edges-top > * { opacity: .13; }
.band { fill: var(--band); }
.e-doc2 { stroke: var(--edge); stroke-width: 3.4; }
.e-doc1 { stroke: var(--edge); stroke-width: 1.6; }
.e-family { stroke: var(--edge-fam); stroke-width: 1.8; stroke-dasharray: 7 4; }
.e-research { stroke: var(--hyp); stroke-width: 2; stroke-dasharray: 11 4 2 4; }
.e-identity { stroke: var(--hyp); stroke-width: 2.4; stroke-dasharray: 1 5; stroke-linecap: round; }
.e-rejected { stroke: var(--rej); stroke-width: 1.6; stroke-dasharray: 3 4; }

.card { position: absolute; left: 0; top: 0; width: 196px; height: 98px; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; box-shadow: var(--shadow); padding: 8px 9px 6px 46px; cursor: pointer; user-select: none; }
.card::before { content: ""; position: absolute; left: 7px; top: 8px; width: 32px; height: 32px; background: var(--sexu);
  -webkit-mask: url(icons/male.png) center / contain no-repeat; mask: url(icons/male.png) center / contain no-repeat; }
.card.M::before { background: var(--male); }
.card.F::before { background: var(--female); -webkit-mask-image: url(icons/female.png); mask-image: url(icons/female.png); }
.card.cand { border: 1.5px dashed var(--hyp); background: var(--hyp-bg); }
.card.unlikely { opacity: .55; }
.card.sel { box-shadow: 0 0 0 3px var(--hyp), var(--shadow); }
.card.root .nm { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.card.focus { outline: 3px solid var(--lc); outline-offset: 3px; }
.nm { font: 700 13.5px/1.18 var(--serif); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px; }
.nm.ok { color: var(--ink); }
.ok-mark { color: var(--ok); font: 700 12px var(--sans); margin-left: 2px; }
.yr, .pl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.pl { font-size: 11.5px; }
.yr .ok, .pl.ok { color: var(--ink); }
.yr .warn { color: var(--hyp); }
.bd { position: absolute; left: 46px; right: 34px; bottom: 5px; font-size: 10.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.bd b { color: var(--ok); font-weight: 700; }
.bd i { color: var(--hyp); font-style: normal; }
.ex { position: absolute; right: -1px; bottom: -1px; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 6px 0 6px 0; border: 1px solid var(--rule);
  background: var(--bg); font-size: 11.5px; font-weight: 700; color: var(--soft); }
.ex:hover { color: var(--ink); background: var(--band); }
.flag { position: absolute; left: 6px; top: -21px; height: 18px; padding: 0 7px; border-radius: 9px 9px 9px 0; background: var(--lc); color: #fff;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; line-height: 18px; white-space: nowrap; }
.chip { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); max-width: 190px; height: 20px; padding: 0 8px; border-radius: 10px;
  border: 1px solid var(--hyp); background: var(--surface); color: var(--hyp); font-size: 10.5px; line-height: 18px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.chip.rej { border-color: var(--rej); color: var(--soft); text-decoration: line-through; text-decoration-color: var(--rej); }

#gens { position: fixed; left: 0; top: 0; bottom: 0; width: 0; pointer-events: none; z-index: 3; }
.glab { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); padding: 4px 8px 4px 7px; border-left: 3px solid var(--edge-fam);
  background: color-mix(in srgb, var(--bg) 88%, transparent); white-space: nowrap; }
.glab b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
.glab span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

#bar { position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(100vw - 400px); }
.btn { height: 34px; padding: 0 11px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); white-space: nowrap; }
.btn:hover { background: var(--band); }
.btn.on { border-color: var(--hyp); color: var(--hyp); }
#famtog { display: inline-flex; align-items: center; gap: 7px; }
.famx { display: none; width: .72em; height: .72em; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; fill: none; }
#famtog.on .famx { display: block; }
#fams { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
#fams[hidden] { display: none; }
.famchip { height: 28px; padding: 0 10px 0 8px; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow);
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.famchip i { width: 11px; height: 11px; border-radius: 50%; background: var(--fc); flex: none; }
.famchip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.famchip.on { border-color: var(--fc); box-shadow: 0 0 0 1.5px var(--fc), var(--shadow); }
.famchip.off { opacity: .5; }
/* карточка в режиме «По семьям»: полоса слева и лёгкий оттенок; рамка кандидата сохраняется */
.card.fam { border-left: 6px solid var(--fc); background: color-mix(in srgb, var(--fc) 10%, var(--surface)); }
.card.fam.famdim { opacity: .45; }
#qres .grp { padding: 6px 10px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); background: var(--bg); }
#qres .snip { display: block; color: var(--soft); font-size: 12px; line-height: 1.35; }
.cell.flash { box-shadow: 0 0 0 2px var(--hyp); transition: box-shadow .3s; }
.sq { width: 34px; padding: 0; font-size: 18px; line-height: 1; }
#qwrap { position: relative; }
#q { height: 34px; width: 220px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); }
#qres { position: absolute; top: 38px; left: 0; width: 300px; max-height: 50vh; overflow: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); }
#qres button { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; border-bottom: 1px solid var(--rule); background: none; }
#qres button:hover, #qres button:focus { background: var(--band); }
#qres small { color: var(--muted); }

#legend { position: fixed; z-index: 4; left: max(10px, env(safe-area-inset-left, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px));
  max-width: calc(100vw - 20px); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow);
  padding: 6px 10px 8px; font-size: 12px; color: var(--soft); }
.lg-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.lg-head b { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); }
#lgtog { border: 0; background: none; padding: 2px 0; font-size: 12px; color: var(--hyp); }
#lgtog:hover { text-decoration: underline; }
#lg-body { display: grid; grid-template-columns: auto auto; gap: 3px 16px; margin-top: 5px; }
#lg-body[hidden] { display: none; }
#lg-body > div { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
#lg-body svg { flex: none; }
#lg-body > .lg-ver { grid-column: 1 / -1; display: block; white-space: normal; margin-top: 4px; padding-top: 5px; border-top: 1px solid var(--rule);
  font-size: 11.5px; line-height: 1.45; color: var(--soft); font-variant-numeric: tabular-nums; }
.lg-ver b { color: var(--ink); font-weight: 700; }
.lg-card { width: 22px; height: 14px; border-radius: 3px; border: 1px solid var(--rule); background: var(--surface); flex: none; }
.lg-card.c { border: 1.5px dashed var(--hyp); background: var(--hyp-bg); }
.lg-t { color: var(--muted); } .lg-t b { color: var(--ink); font-weight: 400; }
#lg-body > .lg-cr { grid-column: 1 / -1; font-size: 10.5px; color: var(--muted); }

#panel { position: fixed; z-index: 6; top: 0; right: 0; bottom: 0; width: 380px; background: var(--surface); border-left: 1px solid var(--rule);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
#tabs { display: flex; border-bottom: 1px solid var(--rule); flex: none; }
#tabs button { flex: 1; height: 42px; border: 0; background: none; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; }
#tabs button.on { color: var(--ink); border-bottom-color: var(--hyp); }
#tabs #hide { flex: 0 0 42px; font-size: 18px; }
#pbody { overflow: auto; padding: 14px 16px 24px; flex: 1; min-height: 0; }
#panel.min #pbody { display: none; }
h2 { font: 700 19px/1.2 var(--serif); margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); margin: 18px 0 6px; }
.sub { color: var(--soft); font-size: 13px; }
.line { border: 1px solid var(--rule); border-left: 4px solid var(--lc); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
.line h4 { margin: 0; font-size: 14.5px; }
.state { display: inline-block; margin: 4px 0; padding: 1px 8px; border-radius: 9px; background: var(--lc); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.state.wait { background: none; color: var(--lc); border: 1px solid var(--lc); }
.hyp { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--rule); background: none; padding: 8px 0; font-size: 13px; cursor: pointer; }
.hyp.cell { border: 1px solid var(--rule); padding: 8px 10px; }
.hyp.cell.has-icons { padding-right: 58px; }
.hyp:hover .ht { text-decoration: underline; }
.need { display: block; color: var(--hyp); font-size: 12.5px; margin-top: 3px; }
.need::before { content: "Что нужно: "; font-weight: 700; }
.reason { display: block; color: var(--soft); font-size: 12.5px; margin-top: 3px; }
.reason::before { content: "Почему отброшено: "; font-weight: 700; }
.fact { padding: 7px 0; border-top: 1px solid var(--rule); font-size: 13px; }
/* ячейка факта/связи/гипотезы: значки документов и ссылок в правом верхнем углу */
.cell { position: relative; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
.cell.has-icons { padding-right: 58px; }
.ficons { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; }
.ic { width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 5px; background: none; color: var(--soft); padding: 0; position: relative; }
.ic:hover { background: var(--band); color: var(--hyp); }
.ic svg { width: 17px; height: 17px; }
.ic .n { position: absolute; right: -2px; bottom: -2px; min-width: 10.5px; height: 10.5px; padding: 0 2.5px; border-radius: 6px; background: var(--soft); color: var(--surface); font-size: 7.5px; line-height: 10.5px; font-weight: 700; }
.menu { position: absolute; right: 0; top: 28px; z-index: 2; min-width: 240px; max-width: 320px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); padding: 4px 0; }
.menu a { display: block; padding: 6px 10px; color: var(--ink); text-decoration: none; font-size: 12.5px; }
.menu a:hover { background: var(--band); }
.menu small { display: block; color: var(--muted); overflow-wrap: anywhere; }
details.sec { border-top: 1px solid var(--rule); margin-top: 14px; }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 10px 0 8px;
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor; transform: rotate(45deg); margin: 0 4px 3px 0; transition: transform .15s; }
details.sec:not([open]) > summary::after { transform: rotate(-45deg); margin-bottom: 0; }
details.sec > summary:hover { color: var(--ink); }
/* галерея документов: поверх схемы, панель справа остаётся видна */
#viewer { position: fixed; z-index: 7; left: 0; top: 0; right: var(--vr, 380px); bottom: var(--vb, 0px); background: rgb(14 18 24 / .9); color: #eef1f4;
  display: grid; grid-template-rows: auto 1fr auto auto; padding-top: env(safe-area-inset-top, 0px); }
#viewer[hidden] { display: none; }
.vhead { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px 8px; }
.vhead .t { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; font-weight: 700; }
.vbtn { border: 1px solid rgb(255 255 255 / .25); background: rgb(255 255 255 / .08); color: #eef1f4; border-radius: 6px; height: 32px; min-width: 32px; padding: 0 10px; }
.vbtn:hover { background: rgb(255 255 255 / .18); }
.vbtn[hidden] { display: none; }
.stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; }
.stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; background: #fff; box-shadow: 0 2px 16px rgb(0 0 0 / .5); }
.stage iframe, .stage pre, .stage .other { position: absolute; inset: 10px 60px; width: calc(100% - 120px); height: calc(100% - 20px); border: 0; background: #fff; color: #1d2733; }
.stage pre { margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; font: 12px/1.45 ui-monospace, Consolas, monospace; }
.stage .other { display: grid; place-content: center; gap: 10px; text-align: center; font-size: 14px; background: rgb(255 255 255 / .06); color: #eef1f4; }
.stage .other a, .cap a { color: #f7a8cd; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 56px; font-size: 26px; z-index: 1; }
.nav.prev { left: 10px; } .nav.next { right: 10px; }
.cap { padding: 8px 14px; font-size: 12.5px; line-height: 1.45; border-top: 1px solid rgb(255 255 255 / .12); max-height: 30vh; overflow: auto; }
.cap .c { color: #b9c2cc; }
.thumbs { display: flex; gap: 14px; overflow-x: auto; padding: 8px 14px calc(12px + env(safe-area-inset-bottom, 0px)); }
.tg { flex: none; }
.tg .lab { font-size: 11px; color: #b9c2cc; margin-bottom: 4px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.tg .row { display: flex; gap: 6px; }
.th { width: 64px; height: 64px; border: 2px solid transparent; border-radius: 4px; padding: 0; background: #fff center / cover no-repeat; opacity: .7; color: #1d2733; font-size: 11px; font-weight: 700; }
.th.on { border-color: #f7a8cd; opacity: 1; }
.lv { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 0 6px; border-radius: 8px; margin-right: 6px; border: 1px solid currentColor; }
.lv-doc2, .lv-doc1 { color: var(--ok); } .lv-family { color: var(--muted); } .lv-hyp, .lv-research, .lv-open { color: var(--hyp); } .lv-rejected { color: var(--rej); }
.src { font-size: 12.5px; color: var(--soft); padding: 5px 0; border-top: 1px solid var(--rule); }
.src b { color: var(--ink); font-weight: 700; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.plink { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 2px; }
.meta { margin-top: 22px; font-size: 11.5px; color: var(--muted); }
.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }
.fb { display: grid; gap: 8px; margin-top: 10px; padding: 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); }
.fb label { font-size: 12px; color: var(--soft); }
.fb .chk { align-items: flex-start; color: var(--soft); }
.fb .chk input { margin-top: 3px; }
.fb input:not([type=checkbox]), .fb select, .fb textarea { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface); }
.fb textarea { resize: vertical; min-height: 96px; line-height: 1.4; }
.fb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fb-row > div { display: grid; gap: 4px; min-width: 0; }
.fb .note { font-size: 11.5px; color: var(--muted); }
.btn.primary { background: var(--hyp); border-color: var(--hyp); color: #fff; justify-self: start; }
.btn.primary:disabled { opacity: .6; cursor: wait; }
.fb-msg { font-size: 13px; }
.fb-msg.err { color: var(--hyp); } .fb-msg.ok { color: var(--ok); }
.st { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 0 6px; border-radius: 8px; margin-right: 6px; border: 1px solid currentColor; color: var(--muted); }
.st-проверяем { color: var(--hyp); } .st-подтверждено, .st-принято { color: var(--ok); } .st-не { color: var(--rej); }
.fbtext { white-space: pre-wrap; overflow-wrap: anywhere; }

@media (max-width: 760px) {
  #bar { max-width: calc(100vw - 20px); }
  #q { width: 150px; }
  .btn .long { display: none; }
  .fb-row { grid-template-columns: 1fr; }
  #panel { top: auto; left: 0; width: auto; height: 52vh; border-left: 0; border-top: 1px solid var(--rule); border-radius: 12px 12px 0 0;
    padding-left: env(safe-area-inset-left, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #panel.min { height: auto; }
  #legend { bottom: calc(52vh + 8px); font-size: 11px; padding: 5px 8px 6px; }
  body.pmin #legend { bottom: calc(50px + env(safe-area-inset-bottom, 0px)); }
}

<body>

<script>
'use strict';
const CW = 196, CH = 98, SG = 40, GAP = 34, ROW = 206;
let FAMW = .05;  // притяжение связанных блоков к своей семье (одиночки без связей — 1, выбранная семья — 4)
const STRUCT = new Set(['parent', 'spouse', 'sibling']);
const CAND = new Set(['candidate', 'hypothesis', 'unlikely']);
const LV_NAME = { doc2: 'подтверждено', doc1: 'подтверждено', family: 'семейные сведения', hyp: 'гипотеза', research: 'гипотеза', open: 'не решено', rejected: 'отброшено' };
const CAND_NAME = { 'tree-entry-unverified': 'запись семейного дерева', candidate: 'кандидат из архивных источников', hypothesis: 'гипотетический предок',
  'identity-probable': 'личность подтверждена документами (вероятно)', 'identity-confirmed': 'личность подтверждена документами',
  'family-reported': 'со слов семьи', unlikely: 'маловероятный кандидат' };
const LIV_NAME = { living: 'жив(а)', deceased: 'умер(ла)', 'probably-deceased': 'вероятно, умер(ла)', 'possibly-living': 'возможно, жив(а)', unknown: 'неизвестно' };
const T_NAME = { parent: 'родитель', spouse: 'супруг(а)', sibling: 'брат/сестра', cousin: 'двоюродные', kinship: 'родство', identity: 'одно лицо?' };

const S = { expanded: new Set(), forced: new Set(), all: false, showRej: false, sel: null, view: { x: 0, y: 0, k: 1 }, pos: new Map(), tab: 'search' };
let D, P, E, nb, CL, LN, minGen, maxGen;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PAGE_LANG = 'ru';  // английская версия страницы собирается заменой подписей (kin/web/i18n-en.json)
let ALIASES = [];  // варианты написания фамилии для поиска: case.json → site.search_aliases
const norm = s => ALIASES.reduce((x, [a, b]) => x.split(a).join(b), s.toLowerCase().replace(/ё/g, 'е'));

fetch('tree.json', { cache: 'no-store' }).then(r => r.json()).then(init).catch(err => {
  document.body.insertAdjacentHTML('beforeend', `<p style="position:fixed;top:60px;left:16px">Не удалось загрузить данные схемы (${esc(err.message)}). Обновите страницу.</p>`);
});

function init(data) {
  D = data; ALIASES = D.meta.aliases || []; P = new Map(D.persons.map(p => [p.id, p])); E = D.edges;
  if (D.meta.title) document.title = D.meta.title;
  // переключатель языка: index.ru.html / index.en.html (данные одни и те же), выбор запоминается
  const otherLang = PAGE_LANG === 'ru' ? 'en' : 'ru', goLang = () => location.href = 'index.' + otherLang + '.html' + location.hash;
  $('langtog').onclick = () => { try { localStorage.setItem('kin-lang', otherLang); } catch (e) {} goLang(); };
  try { if (/(^|\/)(index\.html)?$/.test(location.pathname) && localStorage.getItem('kin-lang') === otherLang) { goLang(); return; } } catch (e) {}
  (D.families || []).forEach(f => { FAMCOL[f.key] = f.color; });
  D.claims.forEach(c => { c.q = norm([c.text, c.next].join(' ')); });
  CL = new Map(D.claims.map(c => [c.id, c])); LN = new Map(D.lines.map(l => [l.id, l]));
  nb = new Map(D.persons.map(p => [p.id, []]));
  for (const e of E) { nb.get(e.a)?.push(e); nb.get(e.b)?.push(e); }
  const gs = D.persons.map(p => p.gen); minGen = Math.min(...gs); maxGen = Math.max(...gs);
  const h = decodeURIComponent(location.hash.slice(1));
  if (P.has(h)) { VIS = computeVisible(); if (!VIS.has(h)) revealPath(h); S.sel = h; }  // ссылка #P-…: человек вместе с цепочкой родства
  bindUI(); renderVersion(); renderPanel(); relayout(null, false);
  if (S.sel) focusPerson(S.sel); else fit(false, D.persons.filter(p => p.direct && VIS.has(p.id)).map(p => p.id));
}

// версия схемы и последнее изменение данных (подпись чата из коммита — см. CLAUDE.md, правило «Подпись»)
function renderVersion() {
  const m = D.meta, ch = m.change;
  let when = '';
  if (ch && ch.date) { const d = new Date(ch.date); when = isNaN(d) ? ch.date : d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  $('lg-ver').innerHTML = `Версия: <b>${esc(m.schema || '—')}</b> · данные ${esc(m.version)}` +
    (ch ? `<br>Изменено: ${esc(when)}<br>Автор: ${ch.chat ? `<b>чат «${esc(ch.chat)}»</b>` : 'без подписи чата'}` : '');
  if (ch) $('lg-ver').title = `${ch.subject || ''} (${ch.commit || ''})`;
}

/* ---------- кто виден ---------- */
const other = (e, id) => e.a === id ? e.b : e.a;
function edgeShown(e) { return e.lv !== 'rejected' || S.showRej; }
function baseVisibleCore(p) { return p.direct || CAND.has(p.cand); }
function baseVisible(p) {
  if (S.all) return p.cand !== 'unlikely' || S.showRej;
  if (p.cand === 'unlikely') return S.showRej;
  return p.direct || CAND.has(p.cand) || S.forced.has(p.id);
}
function computeVisible() {
  const vis = new Set(D.persons.filter(baseVisible).map(p => p.id));
  for (const id of [...vis]) for (const e of nb.get(id)) if (e.lv === 'research' || e.t === 'identity') { if (edgeShown(e)) vis.add(other(e, id)); }
  let grew = true;
  while (grew) {
    grew = false;
    for (const id of S.expanded) {
      if (!vis.has(id)) continue;
      for (const e of nb.get(id)) {
        if (!STRUCT.has(e.t) || !edgeShown(e)) continue;
        const o = other(e, id);
        if (!vis.has(o) && (P.get(o).cand !== 'unlikely' || S.showRej)) { vis.add(o); grew = true; }
      }
    }
  }
  for (const id of [...S.expanded]) if (!vis.has(id)) S.expanded.delete(id);
  return vis;
}
const FAMCOL = {};
function setFamMode(on, persist = true) {
  const had = S.famFilter; S.famMode = on; if (!on) applyFamFilter(null);
  $('famtog').classList.toggle('on', on); $('famtog').setAttribute('aria-pressed', on);
  $('famtog').title = on ? 'Выключить режим «По семьям»' : 'Раскрасить карточки по семьям';
  if (persist) { try { localStorage.setItem('fam-mode', on ? '1' : '0'); } catch (e) {} }
  renderFams(); if (LAY) had ? relayout(famAnchor(had)) : refreshCards();
}
// фильтр семьи: показать всех её людей вместе с цепочками родства до видимых; при смене или сбросе фильтра — убрать только добавленное им
function applyFamFilter(f) {
  if (S.famAdded) { S.famAdded.forEach(id => S.forced.delete(id)); S.famAdded = null; }
  S.famFilter = f;
  VIS = computeVisible();
  if (!f) return;
  const before = new Set(S.forced);
  for (const p of D.persons) {
    if (p.fam !== f || VIS.has(p.id) || (p.cand === 'unlikely' && !S.showRej)) continue;
    revealPath(p.id); VIS = computeVisible();
  }
  S.famAdded = new Set([...S.forced].filter(id => !before.has(id)));
}
// при перестройке под семью экран держится за её карточку (выбранную или первую видимую)
function famAnchor(f) {
  if (S.sel && VIS.has(S.sel) && P.get(S.sel).fam === f) return S.sel;
  return [...VIS].find(id => P.get(id).fam === f && P.get(id).direct) || [...VIS].find(id => P.get(id).fam === f) || D.meta.root;
}
function renderFams() {
  $('fams').hidden = !S.famMode;
  $('fams').innerHTML = (D.families || []).map(f => `<button class="famchip${S.famFilter === f.key ? ' on' : S.famFilter ? ' off' : ''}" data-fam="${esc(f.key)}" style="--fc:${f.color}" title="${S.famFilter === f.key ? 'Показать все семьи' : 'Оставить цветной только эту семью'}"><i></i>${esc(f.name)} <small>${f.count}</small></button>`).join('');
}
function refreshCards() { buildCards(); place(1, S.pos); }
function hiddenCount(id, vis) {
  const s = new Set();
  for (const e of nb.get(id)) if (STRUCT.has(e.t) && edgeShown(e) && !vis.has(other(e, id))) s.add(other(e, id));
  return s.size;
}

/* ---------- раскладка: колена по Y, семьи по X ---------- */
function layout(vis) {
  const ids = [...vis].sort();
  const gen = id => P.get(id).gen;
  const ve = E.filter(e => vis.has(e.a) && vis.has(e.b) && edgeShown(e));
  // блоки: супруги и «возможно, одно лицо» в одном колене стоят рядом
  const parent = new Map(ids.map(i => [i, i]));
  const find = x => parent.get(x) === x ? x : (parent.set(x, find(parent.get(x))), parent.get(x));
  const sameRow = ve.filter(e => (e.t === 'spouse' || e.t === 'identity') && gen(e.a) === gen(e.b));
  for (const e of sameRow) parent.set(find(e.a), find(e.b));
  const groups = new Map();
  for (const i of ids) { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(i); }
  const adjRow = new Map(ids.map(i => [i, []]));
  for (const e of sameRow) { adjRow.get(e.a).push(e); adjRow.get(e.b).push(e); }
  const units = [];
  for (const mem of groups.values()) units.push({ mem: orderUnit(mem, adjRow), gen: gen(mem[0]) });
  const unitOf = new Map();
  for (const u of units) { u.w = u.mem.length * CW + (u.mem.length - 1) * SG; u.mem.forEach((m, i) => { unitOf.set(m, u); u['o' + m] = -u.w / 2 + CW / 2 + i * (CW + SG); }); }
  const off = id => unitOf.get(id)['o' + id];

  // подсказка X: родословная от корня (отец слева, мать справа), остальные — по уже размещённым родственникам
  const hint = new Map();
  const root = D.meta.root;
  const parentsOf = id => ve.filter(e => e.t === 'parent' && e.b === id).map(e => e.a)
    .sort((a, b) => (P.get(a).sex === 'F') - (P.get(b).sex === 'F') || a.localeCompare(b));
  if (vis.has(root)) {
    const q = [[root, 0, 1]]; hint.set(root, 0);
    while (q.length) {
      const [id, x, w] = q.shift();
      const ps = parentsOf(id).filter(p => !hint.has(p));
      ps.forEach((p, i) => { const px = x - w / 2 + w / ps.length * (i + .5); hint.set(p, px); q.push([p, px, w / ps.length]); });
    }
  }
  const lineHint = new Map();
  for (const l of D.lines) for (const f of l.focus) if (hint.has(f)) lineHint.set(l.id, hint.get(f));
  let changed = true, guard = 0;
  while (changed && guard++ < 50) {
    changed = false;
    for (const id of ids) {
      if (hint.has(id)) continue;
      const hs = [];
      for (const e of nb.get(id)) { const o = other(e, id); if (vis.has(o) && hint.has(o)) hs.push(hint.get(o)); }
      if (hs.length) { hint.set(id, hs.reduce((a, b) => a + b, 0) / hs.length + (id.localeCompare(root) * 1e-4)); changed = true; }
    }
    if (!changed) {
      const rest = ids.filter(i => !hint.has(i));
      if (rest.length) {
        // без видимых связей: к своей семье (фамилия по рождению), ближе к своему колену; нет семьи — к линии поиска
        const p = P.get(rest[0]);
        const kin = ids.filter(i => hint.has(i) && p.fam && P.get(i).fam === p.fam);
        const near = kin.filter(i => Math.abs(gen(i) - p.gen) <= 1);
        const fh = (near.length ? near : kin).map(i => hint.get(i));
        const lh = lineHint.has(p.line) ? lineHint.get(p.line) : 0;
        hint.set(rest[0], fh.length ? fh.reduce((a, b) => a + b, 0) / fh.length : lh + (lh < 0 ? -0.6 : 0.6)); changed = true;
      }
    }
  }
  const rows = new Map();
  for (const u of units) { if (!rows.has(u.gen)) rows.set(u.gen, []); rows.get(u.gen).push(u); }
  const directPerRow = new Map();
  for (const id of ids) if (P.get(id).direct) directPerRow.set(gen(id), (directPerRow.get(gen(id)) || 0) + 1);
  const W = Math.max(900, Math.max(0, ...directPerRow.values()) * (CW + GAP + SG));
  for (const u of units) { u.h = u.mem.reduce((s, m) => s + hint.get(m), 0) / u.mem.length * W; u.x = u.h; }

  // связи для притяжения между коленами
  const links = new Map(units.map(u => [u, []]));
  for (const e of ve) {
    const ua = unitOf.get(e.a), ub = unitOf.get(e.b);
    if (ua === ub) continue;
    const w = e.t === 'parent' ? (P.get(e.a).direct && P.get(e.b).direct ? 3 : 1.5) : e.t === 'sibling' ? .6 : .4;
    links.get(ua).push([ub, off(e.b) - off(e.a), w]); links.get(ub).push([ua, off(e.a) - off(e.b), w]);
  }
  // семья — один куст: блок тянется к середине своей семьи (по всем коленам); одиночки без связей — сильнее;
  // выбранная в фильтре семья — сильно и сплошным отрезком в каждом ряду
  const famsOf = new Map(), famUnits = new Map();
  for (const u of units) {
    const fs = [...new Set(u.mem.map(m => P.get(m).fam).filter(Boolean))];
    famsOf.set(u, fs);
    for (const f of fs) { if (!famUnits.has(f)) famUnits.set(f, []); famUnits.get(f).push(u); }
  }
  const pick = S.famMode && S.famFilter;
  const famW = (u, f) => f === pick ? 4 : links.get(u).length ? FAMW : 1;
  // середина семьи: ближние колена весят больше (брат — рядом с братьями, а не с внуками)
  const famCenter = (u, f) => {
    let s = 0, w = 0;
    for (const v of famUnits.get(f)) if (v !== u) { const k = 1 / (1 + 2 * Math.abs(v.gen - u.gen)); s += v.x * k; w += k; }
    return w ? s / w : null;
  };
  const gensSorted = [...rows.keys()].sort((a, b) => a - b);
  const inPick = u => pick && famsOf.get(u).includes(pick);
  // выбранная семья в ряду — сплошной плотный блок вокруг своей середины
  const packPick = row => {
    const pk = row.filter(inPick);
    if (pk.length < 2) return;
    const mid = pk.reduce((a, u) => a + u.d, 0) / pk.length;
    const tot = pk.reduce((a, u) => a + u.w, 0) + GAP * (pk.length - 1);
    let x = mid - tot / 2;
    for (const u of pk) { u.d = x + u.w / 2; x += u.w + GAP; }
  };
  // сначала связанные блоки (одиночки не раздвигают семьи), затем одиночки — к краю куста своей семьи
  const loose = u => !links.get(u).length;
  const lrows = new Map(gensSorted.map(g => [g, rows.get(g).filter(loose)]));
  for (const g of gensSorted) rows.set(g, rows.get(g).filter(u => !loose(u)));
  for (const u of units) if (loose(u)) u.x = u.h;
  for (let it = 0; it < 40; it++) {
    const order = it % 2 ? [...gensSorted].reverse() : gensSorted;
    for (const g of order) {
      const row = rows.get(g);
      for (const u of row) {
        let s = u.h * .15, ws = .15;
        for (const [v, d, w] of links.get(u)) { s += (v.x + d) * w; ws += w; }
        for (const f of famsOf.get(u)) { const c = famCenter(u, f); if (c !== null) { const w = famW(u, f); s += c * w; ws += w; } }
        u.d = s / ws;
      }
      if (it < 24) {
        // боковая родня — с внешней стороны своего человека прямой линии: родня левого супруга левее пары, правого — правее
        const side = new Map(), axis = unitOf.has(root) ? unitOf.get(root).x : 0;
        const dirs = row.filter(v => v.mem.some(m => P.get(m).direct));
        for (const u of row) {
          if (u.mem.some(m => P.get(m).direct)) continue;
          let best = null;
          for (const v of dirs) v.mem.forEach((m, i) => {
            if (!P.get(m).direct || !famsOf.get(u).includes(P.get(m).fam)) return;
            const sd = v.mem.length > 1 ? (i === 0 ? -1 : i === v.mem.length - 1 ? 1 : 0) : (v.x < axis ? -1 : 1);
            if (sd && (!best || Math.abs(v.d - u.d) < Math.abs(best[0].d - u.d))) best = [v, sd];
          });
          if (best) side.set(u, best[1] < 0 ? Math.min(u.d, best[0].d - 1) : Math.max(u.d, best[0].d + 1));
        }
        const pk = row.filter(inPick), mid = pk.length ? pk.reduce((a, u) => a + u.d, 0) / pk.length : 0;

  st.addEventListener('wheel', ev => { if ($('vimg').hidden) return; ev.preventDefault(); const r = st.getBoundingClientRect(), cx = ev.clientX - r.left, cy = ev.clientY - r.top;
    const k = Math.min(8, Math.max(.05, gview.k * Math.exp(-ev.deltaY * .0015))); gview.x = cx - (cx - gview.x) * k / gview.k; gview.y = cy - (cy - gview.y) * k / gview.k; gview.k = k; applyDoc(); }, { passive: false });
  st.addEventListener('pointerdown', ev => { if (ev.target.closest('button') || $('vimg').hidden) return; st.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    start = { x: ev.clientX, y: ev.clientY, vx: gview.x, vy: gview.y };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: gview.k, vx: gview.x, vy: gview.y, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 }; } });
  st.addEventListener('pointermove', ev => { if (!pts.has(ev.pointerId)) return; pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pinch && pts.size === 2) { const [a, b] = [...pts.values()], r = st.getBoundingClientRect(), k = Math.min(8, Math.max(.05, pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d));
      const mx = pinch.mx - r.left, my = pinch.my - r.top; gview.x = mx - (mx - pinch.vx) * k / pinch.k; gview.y = my - (my - pinch.vy) * k / pinch.k; gview.k = k; applyDoc(); return; }
    gview.x = start.vx + ev.clientX - start.x; gview.y = start.vy + ev.clientY - start.y; applyDoc(); });
  const up = ev => { pts.delete(ev.pointerId); if (pts.size < 2) pinch = null; };
  st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
  addEventListener('resize', () => { if (!$('viewer').hidden) { placeViewer(); fitDoc(); } });
}
function setMin(m) { $('panel').classList.toggle('min', m); document.body.classList.toggle('pmin', m); $('hide').textContent = m ? (innerWidth <= 760 ? '⌃' : '‹') : (innerWidth <= 760 ? '⌄' : '›');
  if (innerWidth > 760) $('panel').style.width = m ? '42px' : ''; $('tabs').querySelectorAll('[role=tab]').forEach(t => t.hidden = m && innerWidth > 760); }

/* ---------- ввод ---------- */
function bindUI() {
  const vp = $('vp'), pts = new Map();
  let start = null, moved = false, pinch = null;
  vp.addEventListener('pointerdown', ev => {
    if (ev.target.closest('button')) return;
    vp.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    moved = false; start = { x: ev.clientX, y: ev.clientY, vx: S.view.x, vy: S.view.y };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: S.view.k, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, vx: S.view.x, vy: S.view.y }; }
  });
  vp.addEventListener('pointermove', ev => {
    if (!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size >= 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const k = Math.min(2.5, Math.max(0.12, pinch.k * d / pinch.d));
      S.view.x = mx - (pinch.mx - pinch.vx) * (k / pinch.k); S.view.y = my - (pinch.my - pinch.vy) * (k / pinch.k); S.view.k = k;
      moved = true; applyView(); return;
    }
    const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; vp.classList.add('drag'); }
    if (moved) { S.view.x = start.vx + dx; S.view.y = start.vy + dy; applyView(); }
  });
  const up = ev => {
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId); vp.classList.remove('drag');
    if (pts.size < 2) pinch = null;
    if (pts.size === 1) { const [r] = pts.values(); start = { x: r.x, y: r.y, vx: S.view.x, vy: S.view.y }; return; }
    if (!moved && ev.type === 'pointerup') {
      const card = document.elementsFromPoint(ev.clientX, ev.clientY).find(el => el.classList?.contains('card'));
      if (card) select(card.dataset.id);
    }
  };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
  $('world').addEventListener('pointerover', ev => { const c = ev.target.closest('.card'); const id = c ? c.dataset.id : null; if (id !== hoverId && ev.pointerType === 'mouse') { hoverId = id; highlight(); } });
  $('world').addEventListener('pointerleave', () => { if (hoverId) { hoverId = null; highlight(); } });
  vp.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015)), ev.clientX, ev.clientY); }, { passive: false });
  $('world').addEventListener('click', ev => {
    const b = ev.target.closest('[data-ex]'); if (!b) return;
    ev.stopPropagation(); const id = b.dataset.ex;
    S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id);
    relayout(id);
  });
  $('zin').onclick = () => { const a = area(); zoomAt(1.25, a.w / 2, a.h / 2); };
  $('zout').onclick = () => { const a = area(); zoomAt(0.8, a.w / 2, a.h / 2); };
  // режим «По семьям»: цвет карточки — по фамилии семьи; фильтр — одна семья цветная, остальные серые
  $('famtog').onclick = () => setFamMode(!S.famMode);
  $('fams').addEventListener('click', ev => {
    const b = ev.target.closest('[data-fam]'); if (!b) return;
    const prev = S.famFilter; applyFamFilter(S.famFilter === b.dataset.fam ? null : b.dataset.fam); renderFams(); relayout(famAnchor(S.famFilter || prev));
  });
  try { if (localStorage.getItem('fam-mode') === '1') setFamMode(true, false); } catch (e) {}
  $('t-search').onclick = () => { S.tab = 'search'; setMin(false); renderPanel(); };
  $('t-person').onclick = () => { S.tab = 'person'; setMin(false); renderPanel(); };
  $('hide').onclick = () => setMin(!$('panel').classList.contains('min'));
  $('pbody').addEventListener('click', ev => {
    const d = ev.target.closest('[data-doc]'), x = ev.target.closest('[data-ext]');
    if (d) { ev.stopPropagation(); openDocs(d.dataset.doc); return; }
    if (x) { ev.stopPropagation(); openExt(x.dataset.ext, x); return; }
    const g = ev.target.closest('[data-go]'); if (g && g.dataset.go) { focusPerson(g.dataset.go); }
  });
  $('pbody').addEventListener('keydown', ev => {
    const g = ev.target.closest('[role=button][data-go]'); if (g && ev.key === 'Enter' && g.dataset.go) focusPerson(g.dataset.go);
  });
  bindViewer();
  $('pbody').addEventListener('submit', ev => { if (ev.target.id === 'fb') { ev.preventDefault(); sendFeedback(ev.target); } });
  $('pbody').addEventListener('change', ev => {
    if (ev.target.id === 'c-rej') { S.showRej = ev.target.checked; renderPanel(); relayout(null, false); }
  });
  const q = $('q'), res = $('qres');
  q.addEventListener('input', () => {
    const t = norm(q.value.trim());
    if (t.length < 2) { res.hidden = true; return; }
    const words = t.split(/\s+/);
    const hits = D.persons.filter(p => p.q && words.every(w => p.q.includes(w))).slice(0, 10);
    const chits = D.claims.filter(c => c.q && words.every(w => c.q.includes(w)) && c.subj.some(x => P.has(x))).slice(0, 12);
    const snip = txt => { const i = norm(txt).indexOf(words[0]); const a = Math.max(0, i - 40); return (a ? '…' : '') + txt.slice(a, a + 150) + (txt.length > a + 150 ? '…' : ''); };
    res.innerHTML = (hits.length ? '<div class="grp">Люди</div>' + hits.map(p => `<button data-id="${p.id}">${esc(p.name)} <small>${esc(p.b?.t || '')} · ${esc(D.gens[p.gen]?.name || '')}</small></button>`).join('') : '') +
      (chits.length ? '<div class="grp">Утверждения</div>' + chits.map(c => `<button data-claim="${c.id}"><span class="lv lv-${c.lv}">${LV_NAME[c.lv]}</span><small>${esc(pname(c.subj.find(x => P.has(x))))}</small><span class="snip">${esc(snip(c.text))}</span></button>`).join('') : '') ||
      '<div style="padding:8px 10px" class="sub">Ничего не нашлось</div>';
    res.hidden = false;
  });
  res.addEventListener('click', ev => {
    const b = ev.target.closest('[data-id]'), c = ev.target.closest('[data-claim]');
    if (b) { res.hidden = true; q.value = ''; focusPerson(b.dataset.id); return; }
    if (c) {  // утверждение: открыть карточку человека и прокрутить к этому утверждению
      const cl = CL.get(c.dataset.claim); res.hidden = true; q.value = '';
      focusPerson(cl.subj.find(x => P.has(x)));
      const el = document.getElementById('cl-' + cl.id);
      if (el) { el.closest('details')?.setAttribute('open', ''); el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2200); }
    }
  });
  q.addEventListener('keydown', ev => { if (ev.key === 'Enter') res.querySelector('[data-id], [data-claim]')?.click(); if (ev.key === 'Escape') res.hidden = true; });
  // легенда: по умолчанию открыта, выбор зрителя запоминается в браузере
  const setLegend = open => { $('lg-body').hidden = !open; $('lgtog').textContent = open ? 'Скрыть' : 'Развернуть'; $('lgtog').setAttribute('aria-expanded', open); };
  let lgOpen = true;
  try { lgOpen = localStorage.getItem('lg-closed') !== '1'; } catch (e) {}
  setLegend(lgOpen);
  $('lgtog').onclick = () => { lgOpen = $('lg-body').hidden; setLegend(lgOpen); try { localStorage.setItem('lg-closed', lgOpen ? '0' : '1'); } catch (e) {} };
  addEventListener('resize', drawGens);
  if (innerWidth <= 760) setMin(true);
}
</script>
